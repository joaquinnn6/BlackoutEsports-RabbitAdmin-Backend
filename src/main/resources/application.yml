server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: blackout-rabbit-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:blackout}
    password: ${RABBITMQ_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  security:
    entra-issuer: ${ENTRA_ISSUER:}
    entra-audience: ${ENTRA_AUDIENCE:}
    entra-scope: ${ENTRA_SCOPE:access_as_user}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

