name: Verificar microservicio RabbitMQ Admin

on:
  push:
    branches: [main, develop, "feature-*"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

      - name: Levantar y verificar dos nodos agrupados
        env:
          RABBITMQ_PASSWORD: ci-only-password
          RABBITMQ_ERLANG_COOKIE: ci-only-cluster-cookie
        run: |
          docker compose -f docker-compose.cluster.yml up -d --wait --wait-timeout 180 rabbit1 rabbit2
          docker compose -f docker-compose.cluster.yml exec -T rabbit1 rabbitmqctl cluster_status
          python3 scripts/check_cluster.py
      - name: Detener infraestructura de pruebas
        if: always()
        env:
          RABBITMQ_PASSWORD: ci-only-password
          RABBITMQ_ERLANG_COOKIE: ci-only-cluster-cookie
        run: |
          docker compose -f docker-compose.cluster.yml logs --tail=250
          docker compose -f docker-compose.cluster.yml down -v
